<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>只给你看的收藏馆</title><style>*{box-sizing:border-box}body{margin:0;color:#425574;background:linear-gradient(130deg,#e6f0fc,#fbe8f1);font:16px/1.8 system-ui;min-height:100vh}main{max-width:480px;margin:12vh auto;padding:40px;background:#ffffffc9;border:1px solid #c5cce2;border-radius:70px 8px 40px 8px}h1{font:36px/1.5 serif}input,button{font:inherit;padding:12px 16px;border:1px solid #adbfd9;border-radius:8px}input{width:100%;margin:14px 0;background:#fff}button{cursor:pointer;background:#e3edfb;color:#425574}small{color:#73829a}#message{min-height:2em;font-size:13px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}#lock{position:fixed;right:12px;bottom:12px;z-index:2;padding:8px 14px;box-shadow:0 3px 15px #647b9530}[hidden]{display:none!important}@media(max-width:540px){main{margin:10vh 18px;padding:30px}}</style><main id="gate"><small>FOR YOUR EYES ONLY</small><h1>有些偏心，<br>只给你看。</h1><p>输入我们私下保存的口令，<br>把这些日子轻轻打开。</p><form id="unlock"><label for="password">访问口令</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">打开收藏馆 →</button></form><p id="message" role="status"></p><small>内容在你的浏览器里解密。口令不会发送到服务器。收藏与愿望暂存在当前浏览器，非云端上传。</small></main><iframe id="museum" title="私人收藏馆" hidden></iframe><button id="lock" hidden>收好并锁定</button><script>
const gate=document.getElementById('gate'),frame=document.getElementById('museum'),lock=document.getElementById('lock'),msg=document.getElementById('message'),submit=document.getElementById('submit');let token,worker;const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));document.getElementById('unlock').onsubmit=async e=>{e.preventDefault();submit.disabled=true;msg.textContent='正在打开，请稍等…';try{if(!('serviceWorker'in navigator)||!crypto.subtle)throw Error('unsupported');await navigator.serviceWorker.register('./sw.js');const reg=await navigator.serviceWorker.ready;worker=reg.active;const encrypted=await(await fetch('./vault.json',{cache:'no-store'})).json();const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(encrypted.salt),iterations:encrypted.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(encrypted.iv)},key,bytes(encrypted.data));const files=JSON.parse(new TextDecoder().decode(clear));token=crypto.randomUUID();await new Promise((resolve,reject)=>{const channel=new MessageChannel();const timer=setTimeout(()=>reject(Error('worker')),10000);channel.port1.onmessage=()=>{clearTimeout(timer);resolve()};worker.postMessage({type:'unlock',token,files},[channel.port2]);});document.getElementById('password').value='';frame.src=new URL('./_vault/'+token+'/index.html',location.href).href;gate.hidden=true;frame.hidden=false;lock.hidden=false;msg.textContent='';}catch(error){msg.textContent=error.name==='OperationError'?'口令不正确，请重试。':'暂时无法打开，请检查网络并用新版浏览器重试。';}finally{submit.disabled=false}};lock.onclick=()=>{worker?.postMessage({type:'lock',token});frame.src='about:blank';frame.hidden=true;lock.hidden=true;gate.hidden=false;document.getElementById('password').focus()};</script></html>
