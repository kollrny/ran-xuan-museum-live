<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>只给你看的收藏馆</title><style>*{box-sizing:border-box}body{margin:0;color:#425574;background:linear-gradient(130deg,#e6f0fc,#fbe8f1);font:16px/1.8 system-ui;min-height:100vh}main{max-width:480px;margin:12vh auto;padding:40px;background:#ffffffc9;border:1px solid #c5cce2;border-radius:70px 8px 40px 8px}h1{font:36px/1.5 serif}input,button{font:inherit;padding:12px 16px;border:1px solid #adbfd9;border-radius:8px}input{width:100%;margin:14px 0;background:#fff}button{cursor:pointer;background:#e3edfb;color:#425574}small{color:#73829a}#message{min-height:2em;font-size:13px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}#lock{position:fixed;right:12px;bottom:12px;z-index:2;padding:8px 14px;box-shadow:0 3px 15px #647b9530}[hidden]{display:none!important}@media(max-width:540px){main{margin:10vh 18px;padding:30px}}body{background:#f7f4f0;isolation:isolate}body:before,body:after{content:'';position:fixed;width:65vw;height:65vw;border-radius:50%;filter:blur(65px);opacity:.3;z-index:-1;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}body:before{background:#92b7e6;left:-30vw;top:-20vw}body:after{background:#eaaac5;right:-25vw;bottom:-30vw;animation-delay:-9s}main{position:relative;max-width:540px;margin:9vh auto;padding:56px 52px 36px;border-radius:160px 160px 16px 16px;text-align:center;border:1px solid #c6bcc080;background:linear-gradient(145deg,#ffffffdf,#fcf7f5d9);box-shadow:0 28px 90px #58637b12,inset 0 0 0 8px #ffffff70;animation:arrive 1.1s ease both}main:before{content:'R · X';display:block;letter-spacing:.4em;color:#8c7590;margin:0 0 22px;font:italic 24px Georgia}h1{font-family:'Songti SC','SimSun',serif;font-weight:400;font-size:clamp(32px,6vw,44px);letter-spacing:.08em;line-height:1.55;margin:22px 0}p{color:#758197}#gate>small:first-of-type{font-size:10px;letter-spacing:.28em}form{margin-top:32px;text-align:left}label{font-size:12px;letter-spacing:.16em;color:#7e7d90}input{background:#ffffffa6;border-color:#d4ced8;transition:box-shadow .25s,border-color .25s;letter-spacing:.1em}input:focus-visible{outline:0;border-color:#829fc9;box-shadow:0 0 0 4px #9fbde226}button{min-height:48px;transition:transform .2s,box-shadow .2s}#submit{width:100%;background:linear-gradient(115deg,#dce9f8,#f4dce7);border:1px solid #ccd1e0;letter-spacing:.12em}button:hover{transform:translateY(-2px);box-shadow:0 8px 22px #687d9e19}button:focus-visible{outline:2px solid #718fb8;outline-offset:4px}button:disabled{cursor:wait;opacity:.65;transform:none}#gate>small:last-child{display:block;font-size:11px;line-height:1.8;max-width:340px;margin:auto;color:#8c8c9b}#message{margin:12px 0;min-height:26px}#lock{bottom:max(12px,env(safe-area-inset-bottom));background:#fffaf4e8;border-radius:24px;font-size:12px;backdrop-filter:blur(12px)}@keyframes drift{to{transform:translate(5vw,6vh)}}@keyframes arrive{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@media(max-width:600px){main{margin:5vh 18px;padding:48px 26px 28px;border-radius:130px 130px 14px 14px}body:before,body:after{width:100vw;height:100vw}h1{margin:20px 0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style><main id="gate"><small>FOR YOUR EYES ONLY</small><h1>有些偏心，<br>只给你看。</h1><p>那些舍不得翻篇的日子，<br>我都想和你，再过一遍。</p><form id="unlock"><label for="password">我们的入馆口令</label><input id="password" type="password" autocomplete="current-password" aria-describedby="message" autocapitalize="off" spellcheck="false" required><button type="button" id="show-password" aria-pressed="false">显示口令</button><button id="submit">打开收藏馆 →</button></form><p id="message" role="status"></p><small>内容在你的浏览器里解密。口令不会发送到服务器。收藏与愿望暂存在当前浏览器，非云端上传。</small></main><iframe id="museum" title="私人收藏馆" hidden></iframe><button id="lock" hidden>收好并锁定</button><script>
const gate=document.getElementById('gate'),frame=document.getElementById('museum'),lock=document.getElementById('lock'),msg=document.getElementById('message'),submit=document.getElementById('submit');document.getElementById('show-password').onclick=e=>{const input=document.getElementById('password');const show=input.type==='password';input.type=show?'text':'password';e.currentTarget.textContent=show?'隐藏口令':'显示口令';e.currentTarget.setAttribute('aria-pressed',String(show))};let token,worker;const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));document.getElementById('unlock').onsubmit=async e=>{e.preventDefault();submit.disabled=true;msg.textContent='正在打开，请稍等…';try{if(!('serviceWorker'in navigator)||!crypto.subtle)throw Error('unsupported');await navigator.serviceWorker.register('./sw.js');const reg=await navigator.serviceWorker.ready;worker=reg.active;msg.textContent='正在取来我们收藏的日子…';const response=await fetch('./vault.json',{cache:'no-store',signal:AbortSignal.timeout(30000)});if(!response.ok)throw Error('network');const encrypted=await response.json();msg.textContent='正在打开这份只属于我们的收藏…';const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value.trim()),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(encrypted.salt),iterations:encrypted.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(encrypted.iv)},key,bytes(encrypted.data));const files=JSON.parse(new TextDecoder().decode(clear));token=crypto.randomUUID();await new Promise((resolve,reject)=>{const channel=new MessageChannel();const timer=setTimeout(()=>reject(Error('worker')),10000);channel.port1.onmessage=()=>{clearTimeout(timer);resolve()};worker.postMessage({type:'unlock',token,files},[channel.port2]);});document.getElementById('password').value='';frame.src=new URL('./_vault/'+token+'/index.html',location.href).href;gate.hidden=true;frame.hidden=false;lock.hidden=false;msg.textContent='';}catch(error){msg.textContent=error.name==='OperationError'?'口令不正确，请重试。':'暂时无法打开，请检查网络并用新版浏览器重试。';}finally{submit.disabled=false}};lock.onclick=()=>{worker?.postMessage({type:'lock',token});frame.src='about:blank';frame.hidden=true;lock.hidden=true;gate.hidden=false;document.getElementById('password').focus()};</script></html>
